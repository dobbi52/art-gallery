<style>
:root{

  --line:#DBDAD4;--line-strong:#BDBCB5;--accent:#33506F;--on-accent:#FFFFFF;--accent-soft:#E6ECF2;

}
@media (prefers-color-scheme: dark){:root{
  --wall:#161615;--panel:#1F1F1E;--mat:#262625;--ink:#ECEBE6;--muted:#A6A59E;--faint:#7C7B75;
  --line:#353532;--line-strong:#4E4D49;--accent:#9DB7D6;--on-accent:#14202D;--accent-soft:#25303C;
  --tape:rgba(196,176,118,.85);--tape-ink:#2E2610;--heart:#E07A6E;--shade:rgba(0,0,0,.7);--danger:#E6837A;--open:#5DBB84;--on-open:#0E2417;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.frame:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .inner{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;flex-direction:column;cursor:pointer;background:none;border:0;padding:0;text-align:left}

.hright{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.years button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.openbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.openbtn[aria-pressed="true"]{background:var(--open);border-color:var(--open);color:var(--on-open);font-weight:500}
.openbtn[aria-pressed="true"]:hover{border-color:var(--open);filter:brightness(1.08)}
.openbtn[aria-pressed="true"] .dot{background:var(--on-open);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.closed-note{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;align-self:center}
.who{font-size:13px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:4px;padding:8px 14px;font-size:14px;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}

main{padding-block:32px 110px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--muted);margin:0 0 6px}

.sec{margin-bottom:48px}

.screen{max-width:520px;margin:6vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px 28px;display:flex;flex-direction:column;gap:16px}

.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:12px 18px;border-radius:999px}
.overlay{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:6px;padding:24px;position:relative}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}

.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot.filled{border-style:solid}

.lb{background:var(--panel);width:100%;max-width:1060px;max-height:100%;overflow:auto;border-radius:6px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);position:relative}
.lb .stage{background:var(--wall);padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-width:0}

.thumbs{display:flex;gap:8px}

.heart{border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:6px 14px;display:inline-flex;gap:6px;align-items:center;font-size:14px;align-self:flex-start;font-variant-numeric:tabular-nums}

.cmts{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.cmt{font-size:14px;display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.cmt>span:first-child{min-width:0;overflow-wrap:anywhere}
.cmt i{font-style:normal;font-size:12px;color:var(--faint);white-space:nowrap}

.addc{display:flex;gap:6px}
.addc input{flex:1;min-width:0}
.note{font-size:13px;color:var(--muted);background:var(--wall);padding:8px 10px;border-radius:4px;margin:0}
.tadmin{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--danger)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.picker button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:10px 6px;display:flex;flex-direction:column;align-items:center}
.picker button:hover{border-color:var(--ink)}
.picker b{font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.picker span{font-size:13px;color:var(--muted)}
.adm .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.adm .row:first-child{border-top:0}
.adm .row>div{min-width:0;flex:1 1 220px}
.adm .row p{margin:0;font-size:13px;color:var(--muted)}
.adm .row strong{font-weight:500}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr img{width:120px;height:120px;image-rendering:pixelated;border:1px solid var(--line);background:#fff}
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mlist span{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px}
.mlist button{background:none;border:0;color:var(--faint);padding:0 6px}
.switch{position:relative;width:44px;height:24px;border-radius:999px;border:0;background:var(--line-strong);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 18px;border-radius:4px;font-size:14px;z-index:95;max-width:calc(100% - 32px);text-align:center}
.bigqr{animation:fadein .3s ease both;position:fixed;inset:0;z-index:85;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.bigqr img{width:min(70vmin,560px);height:auto;image-rendering:pixelated}
.bigqr h2{color:#111;font-size:28px}
.bigqr button{background:#fff;border:1px solid #999;color:#111;border-radius:4px;padding:8px 16px}
.expo{position:fixed;inset:0;z-index:80;background:#0E0E0D;color:#E9E7E1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(ellipse 55% 60% at 50% 38%,rgba(255,244,222,.13),transparent 70%)}
.expo .mat{background:#F7F6F2;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.6);transition:opacity .7s ease}
.expo img{display:block;max-height:64vh;max-width:min(80vw,900px);width:auto;height:auto}
.plaque{text-align:center;transition:opacity .7s ease;max-width:640px}
.plaque h3{font-size:22px;color:#F2F0EA}
.plaque p{margin:4px 0 0;color:#A9A69D;font-size:14px}
.expo .ctl{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:8px;opacity:.55;transition:opacity .2s}
.expo .ctl:hover,.expo .ctl:focus-within{opacity:1}
.expo .ctl button{background:transparent;border:1px solid #4A4944;color:#E9E7E1;border-radius:4px;padding:6px 12px;font-size:13px}
.expo .count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(24px,calc(env(safe-area-inset-right,0px) + 24px));font-size:12.5px;color:#7F7D76;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.expo .room-t{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(24px,calc(env(safe-area-inset-left,0px) + 24px));font-family:var(--serif);font-size:14px;color:#9C9990}
.fade{opacity:0}
#printArea{display:none}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:40px}
.ic{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.ic-main{display:flex;flex-direction:column;text-align:left;color:inherit;text-decoration:none;background:none;border:0;padding:0;flex:1;font:inherit;width:100%}
a.ic-main:hover .ic-t,button.ic-main:hover .ic-t{text-decoration:underline;text-underline-offset:3px}
.ic-media{position:relative;display:block;aspect-ratio:16/9;max-width:100%;background:var(--wall);overflow:hidden}
.ic-media img{width:100%;height:100%;object-fit:cover;display:block}
.ic-play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px}
.ic-body{display:flex;flex-direction:column;gap:2px;padding:12px 14px 14px;min-width:0}
.ic-k{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.ic-t{font-family:var(--serif);font-weight:500;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.ic-s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ic-memo{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;line-height:1.65}
.ic-tools{display:flex;gap:2px;border-top:1px solid var(--line);padding:4px 6px}

.ic-tools .sp{flex:1}
.seg2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}

.seg2 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--wall);border-radius:999px;padding:3px 10px;font-size:12.5px}
.fform{display:flex;flex-direction:column;gap:8px;flex-basis:100%}
.player{background:#000;width:100%;max-width:1000px;border-radius:6px;overflow:hidden}
.pl-frame{aspect-ratio:16/9;max-width:100%}
.pl-frame iframe{width:100%;height:100%;border:0;display:block}
.pl-cap{background:var(--panel);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.pl-cap b{font-family:var(--serif);font-weight:500;font-size:16px;overflow-wrap:anywhere}
.pl-cap a{color:var(--accent);font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes hang{0%{opacity:0;transform:translateY(-16px)}70%{opacity:1;transform:translateY(2px)}100%{opacity:1;transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-32px) scale(.96)}60%{opacity:1;transform:translateY(4px) scale(1)}100%{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes sheetup{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheetup-m{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

@keyframes slide{from{opacity:0;transform:translateX(var(--dx,40px))}to{opacity:1;transform:none}}
[data-anim="rise"]{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
[data-anim="hang"]{animation:hang .6s cubic-bezier(.2,.7,.3,1) both}
[data-anim="drop"]{animation:drop .75s cubic-bezier(.2,.7,.3,1) both}
img.fi{opacity:0;transition:opacity .5s ease}
img.fi.ok{opacity:1}
.overlay.in{animation:fadein .22s ease both}
.overlay.in.sh>.sheet{animation:sheetup .32s cubic-bezier(.2,.7,.3,1) both}
.overlay.out{animation:fadeout .22s ease both;pointer-events:none}
.heart.pop{animation:pop .38s ease}
.lb .stage .mat.slide{animation:slide .32s cubic-bezier(.2,.7,.3,1) both}
.expo{animation:fadein .45s ease both}
.expo.out{animation:fadeout .3s ease both}
.expo .mat{overflow:hidden}
.expo img.kb{animation:kb 7.5s linear both}
@media (max-width:760px){
  .overlay.sh{align-items:flex-end;padding-bottom:0}
  .overlay.sh>.sheet{border-radius:12px 12px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));max-height:92%}
  .overlay.in.sh>.sheet{animation:sheetup-m .34s cubic-bezier(.2,.7,.3,1) both}
}
@media (max-width:760px){
  .lb{grid-template-columns:1fr}
  .lb .stage{padding:18px}
  .lb .stage img{max-height:48vh}
  h1{font-size:25px}
  .wall{column-gap:14px}
  .frame{margin-bottom:20px}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#111}
  body>*:not(#printArea){display:none!important}
  body::before{display:none}
  #printArea{display:block}
  .pp{page-break-after:always;break-after:page;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:250mm;text-align:center;gap:10mm;font-family:var(--sans)}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp h1{font-family:var(--serif);font-size:30pt}
  .pp h2{font-family:var(--serif);font-size:18pt}
  .pp img{max-width:170mm;max-height:180mm;border:6mm solid #fff;outline:0.3mm solid #bbb}
  .pp p{margin:0;color:#555;font-size:11pt;max-width:150mm}
}
</style>
</head>
<body>
<header class="top gut" id="hdr" hidden><div class="inner">
  <button class="brand" id="home"><small id="yearLabel"></small><strong id="clsName">우리 반 미술관</strong></button>
  <div class="hright">
    <div class="years" id="years" role="group" aria-label="학년도"></div>
    <span class="who" id="who"></span>
    <button class="btn sm openbtn" id="openBtn" hidden></button>
    <button class="btn sm" id="adminBtn" hidden>관리</button>
  </div>
</div></header>
<main class="gut"><div class="inner" id="main"><div class="screen"><p>불러오는 중이에요…</p></div></div></main>
<button class="btn primary fab" id="fab" hidden>＋ 작품 올리기</button>
<div id="layer"></div>
<div id="printArea"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, onSnapshot, serverTimestamp, deleteField, writeBatch, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=$('#main');
const KEY_STORE='artGalleryJoinKey';
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};

const cfg=window.FIREBASE_CONFIG||{};
if(!cfg.apiKey){main.innerHTML=`<div class="screen"><h2>Firebase 설정이 필요해요</h2><p>index.html 위쪽의 FIREBASE_CONFIG에 Firebase 콘솔에서 복사한 값을 붙여넣어 주세요.</p></div>`;throw new Error('no config')}
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),st=getStorage(app);

/* QR로 들어오면 주소의 열쇠를 기기에 기억하고 주소에서는 지워요 */
const params=new URLSearchParams(location.search);
const urlKey=params.get('k');
/* 선생님용 QR(?t=1)로 들어오면 학생 기억을 지우고 선생님 로그인 화면으로 */
let wantTeacher=params.get('t')==='1';
if(wantTeacher){try{localStorage.removeItem(KEY_STORE)}catch{}}
else if(urlKey)lsSet(KEY_STORE,urlKey);
if(urlKey||wantTeacher)history.replaceState(null,'',location.pathname);

const S={user:null,role:null,settings:null,me:null,join:null,year:null,view:'home',board:null,student:null,boards:[],works:[],subs:[],setSub:null,featured:[],featNames:{},items:[],topic:null};
const uid=()=>S.user?.uid;
const roster=()=>S.settings?.roster||[];
const nameOf=no=>roster()[no-1]||'';
const toMs=t=>t?.toMillis?t.toMillis():Date.now();
const likeCount=w=>Object.keys(w.likes||{}).length;
const isOpen=()=>S.settings?.uploadOpen!==false;
const canUpload=()=>S.role==='teacher'||isOpen();
/* 움직임: 처음 보이는 것만 차례로 걸리고, 다시 그려도 이어서 움직여요 */
const SHOWN=new Map();let viewKey='';
function anim(id,idx=0,kind='hang'){const now=performance.now();let r=SHOWN.get(id);
  if(!r){r={t:now,d:Math.min(idx,14)*45,k:kind};SHOWN.set(id,r)}
  const el=now-r.t,dur=r.k==='drop'?750:600;if(el>r.d+dur)return '';
  return ` data-anim="${r.k}" style="animation-delay:${Math.round(r.d-el)}ms"`}
const LOADED=new Set();window.__ld=LOADED;
const imgCls=url=>LOADED.has(url)?'class="fi ok"':`class="fi" onload="__ld.add(this.getAttribute('src'));this.classList.add('ok')"`;
function flip(el,from,reverse){const to=el.getBoundingClientRect();if(!to.width)return;const sc=from.width/to.width;
  const dx=(from.left+from.width/2)-(to.left+to.width/2),dy=(from.top+from.height/2)-(to.top+to.height/2);
  const k=[{transform:`translate(${dx}px,${dy}px) scale(${sc})`,opacity:.2},{transform:'none',opacity:1}];
  el.animate(reverse?[k[1],k[0]]:k,{duration:reverse?230:360,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'})}

let tt;function toast(m){clearTimeout(tt);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;tt=setTimeout(()=>t.hidden=true,2800)}
const fail=e=>{console.error(e);toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.')};

/* ---------- 들어오기 ---------- */
onAuthStateChanged(auth,async user=>{
  S.user=user;stopSubs();
  if(user&&user.isAnonymous&&wantTeacher){wantTeacher=false;await signOut(auth);return}
  if(!user){
    if(lsGet(KEY_STORE)){try{await signInAnonymously(auth)}catch(e){showScreen('error')}return}
    return showScreen('landing');
  }
  if(user.isAnonymous){S.role='student';startStudent()}else{S.role='teacher';startTeacher()}
});
function showScreen(kind){
  $('#hdr').hidden=true;$('#fab').hidden=true;
  const T={
    landing:`<h1>우리 반 미술관</h1><p>학생은 선생님이 보여주는 QR 코드를 찍어서 들어와요.</p><button class="btn primary" data-act="login">선생님 로그인</button>`,
    notTeacher:`<h2>선생님 계정이 아니에요</h2><p>${esc(S.user?.email||'')} 계정으로는 들어올 수 없어요. 미술관을 만든 구글 계정으로 다시 로그인해 주세요.</p><button class="btn" data-act="logout">로그아웃</button>`,
    badKey:`<h2>QR이 바뀌었어요</h2><p>선생님이 새 QR을 만들었거나 학년도가 바뀌었어요. 선생님이 보여주는 새 QR을 다시 찍어 주세요.</p>`,
    error:`<h2>연결하지 못했어요</h2><p>인터넷 연결을 확인하고 새로고침해 주세요.</p>`,
    setup:`<h1>미술관 처음 만들기</h1><p>한 번만 하면 돼요. 명단은 나중에 관리 메뉴에서 고칠 수 있어요.</p>
      <div class="field"><label for="sname">미술관 이름</label><input type="text" id="sname" maxlength="20" placeholder="6학년 2반 미술관"></div>
      <div class="field"><label for="syear">학년도</label><input type="number" id="syear" value="${new Date().getFullYear()}"></div>
      <div class="field"><label for="sroster">반 명단 (한 줄에 한 명, 1번부터 차례대로)</label><textarea id="sroster" rows="10" placeholder="강하린&#10;김도윤&#10;김서연"></textarea></div>
      <span class="err" id="serr"></span><button class="btn primary" data-act="setup">미술관 만들기</button>`
  };
  main.innerHTML=`<div class="screen">${T[kind]}</div>`;
}
async function startTeacher(){
  try{
    const s=await getDoc(doc(db,'settings','class'));
    if(!s.exists())return showScreen('setup');
    S.settings=s.data();S.year=S.settings.year;watchSettings();subscribe();
  }catch(e){showScreen('notTeacher')}
}
async function startStudent(){
  const key=lsGet(KEY_STORE);
  let m=null;
  try{const s=await getDoc(doc(db,'members',uid()));m=s.exists()?s.data():null}catch{}
  if(m&&key&&m.key!==key){
    try{await setDoc(doc(db,'members',uid()),{key,no:m.no,name:m.name,joinedAt:serverTimestamp()});m.key=key}catch{m=null}
  }
  if(m){
    try{const s=await getDoc(doc(db,'settings','class'));S.settings=s.data();S.me=m;S.year=S.settings.year;watchSettings();subscribe();return}catch{}
  }
  if(!key)return showScreen('badKey');
  try{const j=await getDoc(doc(db,'joins',key));if(!j.exists())return showScreen('badKey');S.join=j.data();showPicker()}
  catch{showScreen('badKey')}
}
function showPicker(){
  $('#hdr').hidden=true;$('#fab').hidden=true;
  main.innerHTML=`<div class="screen" style="max-width:760px"><h1>${esc(S.join.className||'우리 반 미술관')}에 오신 걸 환영해요</h1>
    <p>내 번호를 골라 주세요. 이 기기에 기억돼서 다음부터는 바로 들어와요.</p>
    <div class="picker">${(S.join.roster||[]).map((n,i)=>`<button data-pick="${i+1}"><b>${i+1}</b><span>${esc(n)}</span></button>`).join('')}</div></div>`;
}
function watchSettings(){
  S.setSub&&S.setSub();
  S.setSub=onSnapshot(doc(db,'settings','class'),s=>{
    if(!s.exists())return;const old=S.settings?.year;S.settings=s.data();
    if(S.role==='student'&&S.settings.year!==old){S.year=S.settings.year;subscribe()}
    render();if($('.lb'))drawWork();
  },()=>{if(S.role==='student'){stopSubs();showScreen('badKey')}});
}
function stopSubs(){S.subs.forEach(u=>u());S.subs=[];S.setSub&&S.setSub();S.setSub=null;closeLayer()}
function subscribe(){
  S.subs.forEach(u=>u());S.subs=[];S.boards=[];S.works=[];
  const onErr=e=>{console.error(e);if(S.role==='student'){stopSubs();showScreen('badKey')}else toast('불러오지 못했어요. 새로고침해 주세요.')};
  S.subs.push(onSnapshot(query(collection(db,'boards'),where('year','==',S.year)),q=>{
    S.boards=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>toMs(b.createdAt)-toMs(a.createdAt));render()},onErr));
  const wq=S.role==='teacher'?query(collection(db,'works'),where('year','==',S.year)):query(collection(db,'works'),where('year','==',S.year),where('hidden','==',false));
  S.worksLoaded=false;
  S.subs.push(onSnapshot(wq,q=>{
    if(S.worksLoaded)q.docChanges().forEach(c=>{if(c.type==='added')SHOWN.set(c.doc.id,{t:performance.now(),d:0,k:'drop'})});S.worksLoaded=true;
    S.works=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>toMs(b.createdAt)-toMs(a.createdAt));render();if($('.lb'))drawWork()},onErr));
  const soft=e=>console.error(e);
  S.subs.push(onSnapshot(query(collection(db,'items'),where('year','==',S.year)),q=>{
    S.items=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));render();if(ctx.mode==='ref'&&$('.lb'))drawWork()},soft));
  S.subs.push(onSnapshot(collection(db,'featured'),q=>{
    S.featured=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.year-a.year||toMs(a.createdAt)-toMs(b.createdAt));render();if($('.lb'))drawWork()},soft));
  if(S.role==='teacher')S.subs.push(onSnapshot(query(collection(db,'works'),where('featured','==',true)),q=>{
    S.featNames={};q.docs.forEach(d=>{const x=d.data();S.featNames[d.id]={no:x.no,name:x.name}});render();if(ctx.mode==='feat'&&$('.lb'))drawWork()},soft));
  render();
}

/* ---------- 화면 그리기 ---------- */
const boardWorks=id=>S.works.filter(w=>w.boardId===id);
function render(){
  if(!S.settings)return;
  $('#hdr').hidden=false;
  $('#clsName').textContent=S.settings.className||'우리 반 미술관';
  $('#yearLabel').textContent=`${S.year}학년도`;
  const yrs=S.role==='teacher'?[...new Set([...(S.settings.years||[]),S.settings.year])].sort():[];
  $('#years').innerHTML=yrs.length>1?yrs.map(y=>`<button data-y="${y}" aria-pressed="${y===S.year}">${y}</button>`).join(''):'';
  $('#who').textContent=S.role==='teacher'?'선생님':`${S.me.no}번 ${S.me.name}`;
  $('#adminBtn').hidden=S.role!=='teacher';
  const ob=$('#openBtn');ob.hidden=S.role!=='teacher';ob.setAttribute('aria-pressed',isOpen());
  ob.innerHTML=`<span class="dot" aria-hidden="true"></span>학생 올리기 ${isOpen()?'열림':'닫힘'}`;
  const cur=S.year===S.settings.year;
  if(S.view==='board'&&!S.boards.find(b=>b.id===S.board))S.view='home';
  if(S.view==='topic'&&!S.featured.some(f=>f.topic===S.topic))S.view='home';
  const key=`${S.view}|${S.board}|${S.student}|${S.year}|${S.topic}`;if(key!==viewKey){viewKey=key;SHOWN.clear()}
  main.innerHTML=S.view==='board'?boardView():S.view==='student'?studentView():S.view==='topic'?topicView():homeView();
  $('#fab').hidden=!(S.view==='board'&&cur&&canUpload());
}
function homeView(){
  const cur=S.year===S.settings.year;
  const rooms=S.boards.map((b,i)=>{const ws=boardWorks(b.id);const cover=ws.find(w=>!w.hidden)?.photos?.[0]?.thumb;
    return `<button class="room" data-board="${b.id}"${anim('r'+b.id,i)}><span class="cover"><span style="${cover?`background-image:url('${cover}')`:''}">${cover?'':'아직 작품이 없어요'}</span></span>
      <span><h3>${esc(b.title)}</h3><span class="meta">작품 ${ws.length}점${b.when?` · ${esc(b.when)}`:''}</span></span></button>`}).join('');
  const add=S.role==='teacher'&&cur?`<button class="room new" data-act="newBoard"${anim('rnew',S.boards.length)}><span class="cover"><span>＋ 새 전시실 만들기</span></span><span><h3 style="color:var(--muted)">새 전시실</h3><span class="meta">단원이나 주제별로</span></span></button>`:'';
  const names=cur?roster():[...new Set(S.works.map(w=>w.no))].filter(n=>n>0).sort((a,b)=>a-b).map(no=>S.works.find(w=>w.no===no).name);
  const nos=cur?roster().map((_,i)=>i+1):[...new Set(S.works.map(w=>w.no))].filter(n=>n>0).sort((a,b)=>a-b);
  const rosterHtml=nos.map((no,i)=>`<button data-stu="${no}"${anim('s'+no,i+4)}><b>${no}</b><span>${esc(names[i])}</span><span class="c">${S.works.filter(w=>w.no===no).length}점</span></button>`).join('');
  const emptyRooms=!S.boards.length&&!add?`<div class="empty">아직 전시실이 없어요. 선생님이 전시실을 만들면 여기에 나타나요.</div>`:'';
  return `<section class="sec"><div class="sechead"${anim('head',0,'rise')}><div><p class="eyebrow">${S.year}학년도 전시실</p><h1>${cur?'우리 반 작품들':'지난 학년 작품들'}</h1></div>
    <span class="meta">${S.boards.length}개 전시실 · 작품 ${S.works.length}점</span></div>
    ${emptyRooms}<div class="rooms">${rooms}${add}</div></section>${featSection()}
    ${nos.length?`<section class="sec"><div class="sechead"${anim('head2',4,'rise')}><h2>학생별 모아보기</h2><span class="meta">번호를 누르면 그 학생의 작품만 모여요</span></div><div class="roster">${rosterHtml}</div></section>`:''}`;
}
function frame(w,showBoard,idx=0){
  const b=S.boards.find(x=>x.id===w.boardId);const n=likeCount(w);
  return `<button class="frame${w.hidden?' hid':''}" data-work="${w.id}" aria-label="${esc(w.title||'작품')}${w.no?`, ${w.no}번 ${esc(w.name)}`:''}"${anim(w.id,idx)}>
    <span class="mat"><img src="${esc(w.photos[0].thumb)}" alt="" loading="lazy" ${imgCls(w.photos[0].thumb)} ${w.photos[0].w?`width="${w.photos[0].w}" height="${w.photos[0].h}"`:''}></span>
    <span class="cap">${w.title?`<span class="t">${esc(w.title)}</span>`:''}
    <span class="n"><span>${showBoard?esc(b?.title||''):w.no?`${w.no}번 ${esc(w.name)}`:''}</span>${n?`<span class="h">♥ ${n}</span>`:''}${w.photos.length>1?`<span class="badge">사진 ${w.photos.length}</span>`:''}${w.featured&&S.role==='teacher'?'<span class="badge">대표</span>':''}${w.hidden?'<span class="badge">숨김</span>':''}</span></span></button>`;
}
function boardView(){
  const b=S.boards.find(x=>x.id===S.board);const ws=boardWorks(b.id);const cur=S.year===S.settings.year;
  const body=ws.length?`<div class="wall">${ws.map((w,i)=>frame(w,false,i)).join('')}</div>`:
    `<div class="empty"><h2>아직 걸린 작품이 없어요</h2><span>첫 작품을 올리면 이 벽에 걸려요.</span>${cur&&canUpload()?'<button class="btn primary" data-act="upload">작품 올리기</button>':''}</div>`;
  const tActs=S.role==='teacher'?`<button class="btn" data-act="editBoard">전시실 이름 고치기</button>${cur?'<button class="btn" data-act="addItem">＋ 자료 넣기</button>':''}`:'';
  const its=itemsSection(b.id);
  return `<button class="back" data-act="home">← 전시실로</button>
    <div class="boardhead"${anim('head',0,'rise')}><div><p class="eyebrow">${b.when?esc(b.when)+' · ':''}작품 ${ws.length}점</p><h1>${esc(b.title)}</h1></div>
    <div class="actions">${tActs}${expoList().length?'<button class="btn" data-act="expo">▶ 전시 모드</button>':''}${cur&&canUpload()?'<button class="btn primary" data-act="upload">＋ 작품 올리기</button>':''}${cur&&!canUpload()?'<span class="closed-note">지금은 구경만 할 수 있어요</span>':''}</div></div>${its}${its?`<div class="sechead"><h2>작품</h2><span class="meta">${ws.length}점</span></div>`:''}${body}`;
}
function studentList(){return S.works.filter(w=>w.no===S.student)}

/* 자료 */
const boardItems=id=>S.items.filter(x=>x.boardId===id);
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);return m?m[1]:null};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return ''}};
const fsize=n=>n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round((n||0)/1024))+'KB';
const KIND={link:'링크',youtube:'영상',file:'파일',image:'참고 이미지',memo:'메모'};
function itemCard(x,i,n){const t=S.role==='teacher'&&S.year===S.settings.year;
  const body=(sub,extra='')=>`<span class="ic-body"><span class="ic-k">${KIND[x.type]}</span>${x.title?`<span class="ic-t">${esc(x.title)}</span>`:''}${sub?`<span class="ic-s">${esc(sub)}</span>`:''}${extra}</span>`;
  let main;

  else if(x.type==='image')main=`<button class="ic-main" data-ref="${x.id}"><span class="ic-media"><img src="${esc(x.photos[0].thumb)}" alt="" loading="lazy" ${imgCls(x.photos[0].thumb)}></span>${body(x.note)}</button>`;
  else if(x.type==='file'){const ext=(x.fileName||'').split('.').pop().toUpperCase();

  else main=`<div class="ic-main">${body('',`<span class="ic-memo">${esc(x.text)}</span>`)}</div>`;
  const tools=t?`<div class="ic-tools"><button data-mv="${x.id}" data-d="-1" ${i===0?'disabled':''} aria-label="앞으로">←</button><button data-mv="${x.id}" data-d="1" ${i===n-1?'disabled':''} aria-label="뒤로">→</button><span class="sp"></span><button data-edit="${x.id}">고치기</button></div>`:'';
  return `<div class="ic" data-item="${x.id}"${anim('i'+x.id,i,'rise')}>${main}${tools}</div>`}
function itemsSection(bid){const xs=boardItems(bid);if(!xs.length)return '';

      ${w.desc?`<p class="desc">${esc(w.desc)}</p>`:''}
      <button class="heart${performance.now()-(ctx.popT||0)<380?' pop':''}" style="animation-delay:-${Math.round(performance.now()-(ctx.popT||0))}ms" data-act="heart" aria-pressed="${liked}" ${cur&&!w.hidden?'':'disabled'}>${liked?'♥':'♡'} ${likeCount(w)}</button>
      <div class="cmts"><strong style="font-weight:500;font-size:14px">한 줄 감상 ${ctx.comments.length}</strong>${cm||'<span class="meta">첫 감상을 남겨 보세요.</span>'}
        ${canC?`<form class="addc" id="cform"><input type="text" id="cinput" maxlength="40" placeholder="${t?'선생님 한마디':'좋았던 점을 한 줄로'}" aria-label="한 줄 감상"><button class="btn sm primary">남기기</button></form><span class="err" id="cerr"></span>`:
        `<p class="note">${cur?'선생님이 감상 남기기를 잠시 꺼두었어요.':'지난 학년 작품에는 감상을 남길 수 없어요.'}</p>`}</div>
      ${t?`<div class="tadmin">${ctx.confirm?`<div class="confirm">이 작품을 삭제할까요? 사진과 감상이 모두 지워지고 되돌릴 수 없어요. <button class="btn sm danger" data-act="delyes">삭제</button><button class="btn sm" data-act="delno">취소</button></div>`:
        ctx.feat?featForm(b?.title||''):`${w.featured?`<p class="meta" style="flex-basis:100%;margin:0">대표 작품실 · ${esc(w.topic||'')}</p><button class="btn sm" data-act="unfeat">대표 작품에서 빼기</button>`:'<button class="btn sm" data-act="feat">대표 작품으로</button>'}<button class="btn sm" data-act="hide">${w.hidden?'다시 보이기':'숨기기'}</button><button class="btn sm danger" data-act="del">삭제</button>`}</div>`:''}

let up={photos:[],board:null,busy:false};
function openUpload(){if(!canUpload()){toast('지금은 작품을 올릴 수 없어요');return}up={photos:[],board:S.view==='board'?S.board:S.boards[0]?.id,busy:false};
  if(!S.boards.length){toast('먼저 선생님이 전시실을 만들어야 해요');return}drawUpload()}
function drawUpload(err=''){
  const t=$('#utitle')?.value??'',d=$('#udesc')?.value??'',no=$('#uno')?.value;
  const slots=[0,1,2].map(k=>{const p=up.photos[k];const label=['완성작','부분 확대','과정'][k];

    `<label class="slot"><input type="file" accept="image/*" data-slot="${k}" ${k>up.photos.length?'disabled':''} aria-label="${label} 사진"><span style="font-size:20px">＋</span><span>${label}${k?' (선택)':''}</span></label>`}).join('');

    ${S.role==='teacher'?`<div class="field"><label for="uno">학생 (선택)</label><select id="uno"><option value="0">선택 안 함</option>${roster().map((n,i)=>`<option value="${i+1}" ${String(i+1)===no?'selected':''}>${i+1}번 ${esc(n)}</option>`).join('')}</select></div>`:''}
    <div class="field"><label for="utitle">작품 제목 (선택)</label><input type="text" id="utitle" maxlength="30" value="${esc(t)}" placeholder="우리 동네 저녁"></div>
    <div class="field"><label for="udesc">작품 설명 (선택)</label><textarea id="udesc" maxlength="120" placeholder="어떤 점을 표현하려고 했나요?">${esc(d)}</textarea></div>
    <span class="err" id="uerr">${esc(err)}</span>
    <div class="actions" style="justify-content:flex-end;margin-top:8px"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="submit" id="usub">벽에 걸기</button></div>`,'sheet','upload');
}
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im)};im.onerror=rej;im.src=u})}
function resized(im,max,q){return new Promise(res=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res({blob:b,w:c.width,h:c.height}),'image/jpeg',q)})}
async function addPhoto(file){
  try{const im=await loadImage(file);const full=await resized(im,1600,.85);const thumb=await resized(im,640,.8);
    up.photos.push({full,thumb,preview:URL.createObjectURL(thumb.blob)});drawUpload()}
  catch{drawUpload('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.')}
}
async function submitUpload(){
  if(up.busy)return;if(!canUpload()){closeLayer();toast('선생님이 올리기를 닫았어요');return}
  const title=$('#utitle').value.trim(),desc=$('#udesc').value.trim(),boardId=$('#uboard').value;
  if(!up.photos.length){drawUpload('사진을 한 장 이상 넣어 주세요.');return}
  
  const no=S.role==='teacher'?+$('#uno').value:S.me.no,name=S.role==='teacher'?nameOf(no):S.me.name;
  up.busy=true;const btn=$('#usub');btn.disabled=true;btn.textContent='올리는 중…';
  try{
    const wref=doc(collection(db,'works'));const photos=[];
    for(let k=0;k<up.photos.length;k++){
      const p=up.photos[k];const base=`works/${uid()}/${wref.id}-${k}`;
      const fr=ref(st,base+'.jpg'),tr=ref(st,base+'-t.jpg');
      await uploadBytes(fr,p.full.blob,{contentType:'image/jpeg'});await uploadBytes(tr,p.thumb.blob,{contentType:'image/jpeg'});
      photos.push({url:await getDownloadURL(fr),thumb:await getDownloadURL(tr),path:base+'.jpg',thumbPath:base+'-t.jpg',w:p.thumb.w,h:p.thumb.h});
    }
    await setDoc(wref,{boardId,year:S.settings.year,uid:uid(),no,name,title,desc,photos,likes:{},hidden:false,createdAt:serverTimestamp()});
    closeLayer();S.view='board';S.board=boardId;render();scrollTo(0,0);toast('작품을 벽에 걸었어요');
  }catch(e){up.busy=false;btn.disabled=false;btn.textContent='벽에 걸기';fail(e)}
}

function drawAdmin(){

function putFile(path,blob,meta,onp){return new Promise((res,rej)=>{const t=uploadBytesResumable(ref(st,path),blob,meta);
  t.on('state_changed',x=>onp&&onp(x.bytesTransferred/x.totalBytes),rej,async()=>{try{res(await getDownloadURL(t.snapshot.ref))}catch(e){rej(e)}})})}

  const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(url),{signal:c.signal});return (await r.json()).title||''}catch{return ''}}

async function saveItem(){
  if(itf.busy)return;const T=itf.type;const x=itf.id?S.items.find(i=>i.id===itf.id):null;
  const title=$('#ititle').value.trim(),note=$('#inote')?.value.trim()||'';const err=m=>{$('#ierr').textContent=m};
  const btn=$('#isave');const busy=on=>{itf.busy=on;btn.disabled=on;btn.textContent=on?'저장하는 중…':(x?'저장':'넣기')};
  let data;
  if(T==='link'){let url=$('#iurl').value.trim();if(!url)return err('주소를 넣어 주세요.');if(!/^https?:\/\//i.test(url))url='https://'+url;
    try{new URL(url)}catch{return err('주소를 다시 확인해 주세요.')}
    busy(true);const vid=ytId(url);data={type:vid?'youtube':'link',url,vid:vid||null,title:title||(vid?await ytTitle(url)||'유튜브 영상':host(url)),note}}
  else if(T==='memo'){const text=$('#imemo').value.trim();if(!text)return err('내용을 적어 주세요.');data={type:'memo',text,title,note:''}}
  else if(x){data={title:title||x.title,note}}
  else if(T==='file'){const f=itf.file;if(!f)return err('파일을 골라 주세요.');if(f.size>50*1048576)return err('50MB보다 작은 파일만 넣을 수 있어요.')}
  else if(T==='image'){if(!itf.img)return err('이미지를 골라 주세요.')}
  try{
    busy(true);
    if(x){await updateDoc(doc(db,'items',x.id),data)}
    else{const r=doc(collection(db,'items'));
      if(T==='file'){const f=itf.file;const ext=(f.name.split('.').pop()||'bin').replace(/[^\w]/g,'').slice(0,8);const path=`items/${r.id}.${ext}`;
        const url=await putFile(path,f,{contentType:f.type||'application/octet-stream',contentDisposition:`inline; filename*=UTF-8''${encodeURIComponent(f.name)}`},q=>{btn.textContent=`올리는 중… ${Math.round(q*100)}%`});
        data={type:'file',url,path,fileName:f.name,size:f.size,title:title||f.name.replace(/\.[^.]+$/,''),note}}
      if(T==='image'){const p=itf.img;const base=`items/${r.id}`;
        const url=await putFile(base+'.jpg',p.full.blob,{contentType:'image/jpeg'});const thumb=await putFile(base+'-t.jpg',p.thumb.blob,{contentType:'image/jpeg'});
        data={type:'image',photos:[{url,thumb,path:base+'.jpg',thumbPath:base+'-t.jpg',w:p.thumb.w,h:p.thumb.h}],title,note}}
      await setDoc(r,{...data,boardId:S.board,year:S.year,order:Date.now(),createdAt:serverTimestamp()})}
    closeLayer();toast(x?'저장했어요':'자료를 넣었어요');
  }catch(e){busy(false);fail(e)}
}

  if(a==='featno'){ctx.feat=false;drawWork();return}
  if(a==='unfeat'&&ctx.id){const id=ctx.id;const b=writeBatch(db);b.update(doc(db,'works',id),{featured:false,topic:deleteField()});b.delete(doc(db,'featured',id));await b.commit();toast('대표 작품에서 뺐어요');return}
  if(d.board){S.view='board';S.board=d.board;render();scrollTo(0,0);return}
  if(d.stu){S.view='student';S.student=+d.stu;render();scrollTo(0,0);return}
  if(d.work){openWork(d.work);return}
  if(a==='expo'){openExpo();return}
  if(a==='book'){printBook();return}
  if(d.x){if(d.x==='close')closeExpo();else if(d.x==='play'){ex.play=!ex.play;$('#explay').textContent=ex.play?'일시정지':'재생';tick()}
    else{ex.i=(ex.i+(d.x==='next'?1:-1)+ex.list.length)%ex.list.length;showExpo();tick()}return}
  if(a==='close'){closeLayer();return}
  if(d.ph){ctx.photo=+d.ph;drawWork();return}
  if(a==='prev'||a==='next'){step(a==='next'?1:-1);return}
  const w=S.works.find(x=>x.id===ctx.id);
  if(a==='heart'&&w){const liked=!!w.likes?.[uid()];const l={...(w.likes||{})};if(liked)delete l[uid()];else{l[uid()]=true;ctx.popT=performance.now()}w.likes=l;drawWork();await updateDoc(doc(db,'works',w.id),{[`likes.${uid()}`]:liked?deleteField():true});return}
  if(a==='hide'&&w){await updateDoc(doc(db,'works',w.id),{hidden:!w.hidden});toast(w.hidden?'다시 보이게 했어요':'학생들에게 안 보이게 숨겼어요');return}
  if(a==='del'){ctx.confirm=true;drawWork();return}
  if(a==='delno'){ctx.confirm=false;drawWork();return}
  if(a==='delyes'&&w){
    const cs=await getDocs(collection(db,'works',w.id,'comments'));const b=writeBatch(db);cs.docs.forEach(c=>b.delete(c.ref));b.delete(doc(db,'works',w.id));b.delete(doc(db,'featured',w.id));await b.commit();
    for(const p of w.photos){for(const path of [p.path,p.thumbPath]){try{await deleteObject(ref(st,path))}catch{}}}
    closeLayer();toast('작품을 삭제했어요');return}
  if(d.delc&&ctx.id){await deleteDoc(doc(db,'works',ctx.id,'comments',d.delc));return}
  if(d.rm!==undefined){up.photos.splice(+d.rm,1);drawUpload();return}
  if(a==='submit'){submitUpload();return}
  if(a==='newBoard'){openBoardForm(false);return}
  if(a==='editBoard'){openBoardForm(true);return}
  if(a==='mkBoard'||a==='saveBoard'){const t=$('#nbt').value.trim();if(!t){$('#nberr').textContent='전시실 이름을 적어 주세요.';return}
    const when=$('#nbw').value.trim();
    if(a==='mkBoard'){const r=doc(collection(db,'boards'));await setDoc(r,{year:S.settings.year,title:t,when,createdAt:serverTimestamp()});closeLayer();S.view='board';S.board=r.id;toast('새 전시실을 만들었어요')}
    else{await updateDoc(doc(db,'boards',S.board),{title:t,when});closeLayer();toast('저장했어요')}
    return}
  if(a==='delBoard'){for(const x of boardItems(S.board))await deleteItem(x);await deleteDoc(doc(db,'boards',S.board));closeLayer();S.view='home';render();toast('전시실을 지웠어요');return}
  if(a==='csw'){const on=S.settings.commentsOn===false;await updateDoc(doc(db,'settings','class'),{commentsOn:on});el.setAttribute('aria-checked',on);toast(on?'한 줄 감상을 켰어요':'한 줄 감상을 껐어요');return}
  if(a==='qrbig'||a==='tqrbig'){const t=a==='tqrbig';const ov=document.createElement('div');ov.className='bigqr';
    ov.innerHTML=`<h2>${t?'선생님용 접속':esc(S.settings.className)}</h2><img src="${qrData(t?teacherUrl():joinUrl(),10)}" alt="${t?'선생님용 접속 QR':'학생 입장 QR'}"><p style="margin:0;color:#444">${t?'선생님 휴대폰으로 찍고 구글 계정으로 로그인하세요':'휴대폰 카메라로 찍어서 들어오세요'}</p><button data-act="bigclose">닫기</button>`;document.body.appendChild(ov);return}
  if(a==='bigclose'){$('.bigqr')?.remove();return}
  if(a==='copy'){try{await navigator.clipboard.writeText(joinUrl());toast('주소를 복사했어요')}catch{toast('복사하지 못했어요. 주소를 길게 눌러 복사해 주세요.')}return}
  if(a==='qrnew'){adm.confirm='qrnew';drawAdmin();return}
  if(a==='admNo'){adm.confirm=null;drawAdmin();return}
  if(a==='qrnewYes'){await rotateKey({});adm.confirm=null;adm.members=[];drawAdmin();toast('새 QR을 만들었어요. 예전 QR로는 더 이상 들어올 수 없어요');return}
  if(d.delm){await deleteDoc(doc(db,'members',d.delm));adm.members=adm.members.filter(m=>m.id!==d.delm);drawAdmin();toast('그 학생은 다음에 들어올 때 번호를 다시 골라요');return}
  if(a==='editRoster'){openRoster(false);return}
  if(a==='newYear'){openRoster(true);return}
  if(a==='rosterSave'||a==='newYearYes'){
    const name=$('#rname').value.trim()||S.settings.className,list=$('#rlist').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!list.length){$('#rerr').textContent='반 명단을 한 명 이상 적어 주세요.';return}
    if(a==='rosterSave'){const b=writeBatch(db);b.update(doc(db,'settings','class'),{className:name,roster:list});b.update(doc(db,'joins',S.settings.joinKey),{className:name,roster:list});await b.commit();closeLayer();toast('저장했어요');return}
    const y=S.settings.year+1;await rotateKey({className:name,roster:list,year:y,years:arrayUnion(y)});S.settings.years=[...new Set([...(S.settings.years||[]),y])];
    S.year=y;S.view='home';closeLayer();subscribe();toast(`${y}학년도를 시작했어요. 새 QR을 학생들에게 보여 주세요`);return}
  }catch(err){fail(err)}
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='fform'){e.preventDefault();const topic=$('#ftopic').value.trim();if(!topic){$('#ferr').textContent='주제를 적어 주세요.';return}
    const id=ctx.id;
    try{const b=writeBatch(db);
      if(ctx.mode==='feat'){b.update(doc(db,'featured',id),{topic});b.update(doc(db,'works',id),{topic})}
      else{const w=S.works.find(x=>x.id===id);const bd=S.boards.find(x=>x.id===w.boardId);
        b.update(doc(db,'works',id),{featured:true,topic});
        b.set(doc(db,'featured',id),{topic,year:w.year,title:w.title,desc:w.desc||'',boardTitle:bd?.title||'',photos:w.photos.map(p=>({url:p.url,thumb:p.thumb,w:p.w||null,h:p.h||null})),createdAt:serverTimestamp()})}
      await b.commit();ctx.feat=false;if(S.view==='topic'&&ctx.mode==='feat')S.topic=topic;drawWork();toast(`대표 작품실 「${topic}」에 걸었어요`)}
    catch(err){fail(err)}
    return}
  if(e.target.id!=='cform')return;e.preventDefault();const inp=$('#cinput');const v=inp.value.trim();
  if(!v){$('#cerr').textContent='감상을 한 줄 적어 주세요.';return}
  const data=S.role==='teacher'?{uid:uid(),no:0,name:'선생님',teacher:true,text:v,createdAt:serverTimestamp()}:{uid:uid(),no:S.me.no,name:S.me.name,text:v,createdAt:serverTimestamp()};
  inp.value='';try{await setDoc(doc(collection(db,'works',ctx.id,'comments')),data)}catch(err){inp.value=v;fail(err)}});
document.addEventListener('input',e=>{if(e.target.id==='cinput'){const er=$('#cerr');er&&(er.textContent='')}});
document.addEventListener('change',async e=>{
  if(e.target.id==='ifile'&&e.target.files[0]){itf.file=e.target.files[0];drawItemForm(itf.file.size>50*1048576?'50MB보다 작은 파일만 넣을 수 있어요.':'');return}
  if(e.target.id==='iimg'&&e.target.files[0]){try{const im=await loadImage(e.target.files[0]);const full=await resized(im,1600,.85),thumb=await resized(im,640,.8);
    itf.img={full,thumb,preview:URL.createObjectURL(thumb.blob)};drawItemForm()}catch{drawItemForm('이 이미지는 열 수 없어요.')}return}
  if(e.target.dataset?.slot===undefined||!e.target.files[0])return;up.board=$('#uboard')?.value||up.board;addPhoto(e.target.files[0])});
document.addEventListener('keydown',e=>{
  if($('.bigqr')&&e.key==='Escape'){$('.bigqr').remove();return}
  if($('#expo')){if(e.key==='Escape')closeExpo();if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ex.i=(ex.i+(e.key==='ArrowRight'?1:-1)+ex.list.length)%ex.list.length;showExpo();tick()}return}
  if(!$('#ov'))return;if(e.key==='Escape'&&!up.busy&&!itf.busy)closeLayer();
  if($('.lb')&&document.activeElement?.tagName!=='INPUT'){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)}});
document.addEventListener('mousedown',e=>{if(e.target.id==='ov'&&!up.busy&&!itf.busy)closeLayer()});
</script>
</body>
</html>
